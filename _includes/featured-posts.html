<!-- Optional strip shown only when posts are flagged `featured: true` in front matter. -->
{% assign featured_posts = site.posts | where: "featured", true %}
{% if featured_posts.size > 0 %}
<div class="gh-outer">
<section class="featured-wrapper gh-inner">

    <h2 class="featured-title">Featured articles</h2>

    <div class="featured-feed">
        {% for post in featured_posts limit: 3 %}
        <article class="post">
            <div class="u-placeholder horizontal">
                {% if post.image %}
                    <img class="u-object-fit" src="{{ post.image | relative_url }}" alt="{{ post.title }}" loading="lazy">
                {% endif %}
            </div>
            <h3 class="post-title">{{ post.title }}</h3>
            <a class="u-permalink" href="{{ post.url | relative_url }}" aria-label="{{ post.title }}"></a>
        </article>
        {% endfor %}
    </div>

</section>
</div>
{% endif %}
