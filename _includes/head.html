    {% if page.cover %}{% assign page_image = page.cover %}{% else %}{% assign page_image = "assets/images/cover1.jpg" %}{% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <meta name="referrer" content="origin" />
    <link rel="next" href="{{ "page2/" | relative_url }}" />

    <meta property="og:site_name" content="{{ site.name }}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}" />
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ page_image | relative_url }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}" />
    <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
    <meta name="twitter:url" content="{{ page.url | absolute_url }}" />
    <meta name="twitter:image:src" content="{{ page_image | relative_url }}" />

    {% if page.layout == "post" %}
    {% assign post_author = site.data.authors[page.author] %}
    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ page.title | strip_html | strip_newlines }}",
    "url": "{{ page.url | absolute_url }}",
    "image": "{{ page_image | absolute_url }}",
    "description": "{% if page.description %}{{ page.description | strip_html | strip_newlines }}{% else %}{{ site.description | strip_html | strip_newlines }}{% endif %}",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
    "author": {
        "@type": "Person",
        "name": "{% if post_author %}{{ post_author.name }}{% else %}{{ site.author.name }}{% endif %}"{% if post_author.url %},
        "url": "{{ post_author.url }}"{% endif %}
    },
    "publisher": {
        "@type": "Organization",
        "name": "{{ site.name }}"
    },
    "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ page.url | absolute_url }}"
    }
}
    </script>
    {% else %}
    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "publisher": "{{ site.name }}",
    "name": "{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}",
    "url": "{{ page.url | absolute_url }}",
    "image": "{{ page_image | relative_url }}",
    "description": "{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"
}
    </script>
    {% endif %}

    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "jobTitle": "{{ site.subtitle }}",
    "description": "{{ site.description | strip_html | strip_newlines }}",
    "url": "{{ site.url }}",
    "image": "{{ site.author.avatar }}",
    "homeLocation": "{{ site.author.location }}",
    "sameAs": [
        {%- for author_link in site.author.links -%}
        {{ author_link.url }}{% unless forloop.last %},{% endunless %}
        {%- endfor -%}
    ]
}
    </script>

    <meta name="generator" content="Jekyll 3.0.0" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ "feed.xml" | relative_url }}" />
